services:
  - type: web
    name: latam-cockpit
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: starter             # persistent disk requires starter or above
    disk:
      name: latam-data
      mountPath: /var/data
      sizeGB: 1               # 1 GB (~$0.25/month) — more than enough for JSON
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data      # points writes to the persistent disk
      - key: APP_USERNAME
        sync: false           # set in Render dashboard
      - key: APP_PASSWORD
        sync: false           # set in Render dashboard
      - key: SESSION_SECRET
        generateValue: true   # auto-generated by Render
      - key: SLACK_BOT_TOKEN
        sync: false           # set in Render dashboard
      - key: SLACK_SUMMARY_CHANNEL
        sync: false
      - key: REMINDER_CRON
        value: "0 8 * * 1"
      - key: REMINDER_TZ
        value: America/New_York
      - key: REMINDER_ENABLED
        value: "true"
      - key: APP_URL
        fromService:
          name: latam-cockpit
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL
