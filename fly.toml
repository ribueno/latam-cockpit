app = "latam-cockpit"
primary_region = "ewr"   # US East — closest to ET timezone

[build]

[env]
  NODE_ENV    = "production"
  DATA_DIR    = "/var/data"
  REMINDER_TZ = "America/New_York"
  REMINDER_CRON = "0 8 * * 1"
  REMINDER_ENABLED = "true"
  PORT        = "8080"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source      = "latam_data"
  destination = "/var/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
